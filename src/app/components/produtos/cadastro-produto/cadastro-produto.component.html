<p>cadastro-produto works!</p>
<div class="container">
    <h1>Cadastro de Produto</h1>

    <div class="formulario-tabela">
        <div class="formulario">
            <div>
                <label for="campo-nome">Nome</label>
                <input type="text" id="campo-nome" placeholder="Digite um texto" [(ngModel)]="nome">
            </div>
            
            <div>
                <label for="campo-valor">Valor</label>
                <input type="text" id="campo-valor" [(ngModel)]="valor">
            </div>
            
            <button (click)="salvarProduto()">Salvar</button>
        </div>
        <div class="tabela">
            <table border="1">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nome</th>
                        <th>Valor</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody>
                    @for(produto of produtos; track produto){
                        <tr>
                            <td>{{produto.id}}</td>
                            <td>{{produto.nome}}</td>

                            <td>
                                <button (click)="editar(produto)">Editar</button>
                                <button (click)="apagar(produto)">Apagar</button>
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
